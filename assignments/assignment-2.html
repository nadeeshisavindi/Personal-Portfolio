<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Assignment 2 | Nadeeshi</title>
    <meta name="description" content="CSS grid layout exercise with spanning cells">
    <meta name="author" content="Nadeeshi Savindi">
    <link rel="icon" href="../assets/images/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="../assets/css/normalize.css">
    <link rel="stylesheet" href="../assets/css/preview.css">
    <style>
        main { width: 100vw; height: 100vh; display: grid; grid-template-columns: repeat(4, 1fr); }
        main > div { border: 1px solid black; }
        #div1 { background: red; grid-column: 1 / 3; }
        #div2 { background: green; }
        #div3 { background: orangered; grid-column: 4 / 5; grid-row: 1 / 4; }
        #div4 { background: darkviolet; }
        #div5 { background: deeppink; }
        #div6 { background: blue; }
        #div7 { background: brown; }
        #div8 { background: violet; grid-column: 2 / 4; }
    </style>
</head>
<body>
    <a class="preview-back" href="../assignments.html">← Back</a>
    <main aria-label="CSS grid layout">
        <div id="div1"></div><div id="div2"></div><div id="div3"></div><div id="div4"></div>
        <div id="div5"></div><div id="div6"></div><div id="div7"></div><div id="div8"></div>
    </main>
</body>
</html>
