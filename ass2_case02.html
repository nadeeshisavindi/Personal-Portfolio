<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>piano</title>

    <meta charset="UTF-8">
    <meta name="keywords" content="web, html, css, javascript, js, java, python">
    <meta name="description" content="World best web development tutorials">
    <meta name="author" content="IJSE">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../assets/normalize.css">

    <style>
        .main-piano{
            background: whitesmoke;
            display: flex;
            position: relative;
            padding: 20px;
            width: fit-content;

        }
        .whiteKey{
            background: white;
            border: 1px solid black;
            width: 70px;
            height: 300px;
            position: relative;
            border-radius: 0 0 5px 5px;
            transition-duration: 3000ms;
        }

        .blackKey{
            background: black;
            border: 1px solid black;
            width: 60px;
            height: 200px;
            position: absolute;
            border-radius: 0 0 3px 3px;
            z-index: 2;
            top: 20px;

        }

        #key1{
            left: 135px;

        }
        #key2{ left: 217px; }

        #key3{ left: 307px; }
        #key4{ right: 307px; }
        #key5{ right: 217px; }
        #key6{right: 135px}

        .whiteKey:hover{
            background: lightslategray;

        }

    </style>
</head>
<body>


<div class="main-piano">
    <div class="whiteKey"></div>
    <div class="whiteKey"></div>
    <div class="whiteKey"></div>
    <div class="whiteKey"></div>
    <div class="whiteKey"></div>
    <div class="whiteKey"></div>
    <div class="whiteKey"></div>
    <div class="whiteKey"></div>
    <div class="whiteKey"></div>
    <div class="whiteKey"></div>

    <div class="blackKey" id="key1"></div>
    <div class="blackKey" id="key2"></div>
    <div class="blackKey" id="key3"></div>
    <div class="blackKey" id="key4"></div>
    <div class="blackKey" id="key5"></div>
    <div class="blackKey" id="key6"></div>
</div>

</body>
</html>
