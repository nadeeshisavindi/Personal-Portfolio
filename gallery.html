<main id="main" class="inner">
    <div class="page-hero">
        <div><h1 class="page-title">My Gallery</h1></div>
        <a class="btn back-btn" href="index.html#about"><span aria-hidden="true">←</span> Back</a>
    </div>
    <div class="filter-bar" role="group" aria-label="Filter photos by category">
        <button class="filter-btn" type="button" data-cat="all" aria-pressed="true">All</button>
        <button class="filter-btn" type="button" data-cat="friends" aria-pressed="false">Friends</button>
        <button class="filter-btn" type="button" data-cat="portrait" aria-pressed="false">Portrait</button>
        <button class="filter-btn" type="button" data-cat="landscape" aria-pressed="false">Landscape</button>
        <button class="filter-btn" type="button" data-cat="nature" aria-pressed="false">Nature</button>
    </div>
    <div class="gallery-grid">
        <button type="button" class="gallery-card wide" data-cat="friends" aria-label="View photo: First milestone completed">
            <img src="assets/images/gallery-friends.webp" width="960" height="1280" loading="lazy" decoding="async" alt="Nadeeshi with friends celebrating a first milestone">
            <span class="overlay"><span class="card-label">First milestone completed</span><span class="card-cat">Friends</span></span>
        </button>
        <button type="button" class="gallery-card " data-cat="portrait" aria-label="View photo: Confidence in every frame">
            <img src="assets/images/gallery-portrait-1.webp" width="704" height="963" loading="lazy" decoding="async" alt="Portrait of Nadeeshi looking confident">
            <span class="overlay"><span class="card-label">Confidence in every frame</span><span class="card-cat">Portrait</span></span>
        </button>
        <button type="button" class="gallery-card tall" data-cat="landscape" aria-label="View photo: High">
            <img src="assets/images/gallery-landscape.webp" width="960" height="1280" loading="lazy" decoding="async" alt="View from high up">
            <span class="overlay"><span class="card-label">High</span><span class="card-cat">Landscape</span></span>
        </button>
        <button type="button" class="gallery-card " data-cat="nature" aria-label="View photo: Where love meets the ocean">
            <img src="assets/images/gallery-nature-1.webp" width="960" height="1280" loading="lazy" decoding="async" alt="Seaside scene by the ocean">
            <span class="overlay"><span class="card-label">Where love meets the ocean</span><span class="card-cat">Nature</span></span>
        </button>
        <button type="button" class="gallery-card " data-cat="portrait" aria-label="View photo: Shopping time">
            <img src="assets/images/gallery-portrait-2.webp" width="839" height="1040" loading="lazy" decoding="async" alt="Nadeeshi out shopping">
            <span class="overlay"><span class="card-label">Shopping time</span><span class="card-cat">Portrait</span></span>
        </button>
        <button type="button" class="gallery-card " data-cat="nature" aria-label="View photo: Natural light">
            <img src="assets/images/gallery-nature-2.webp" width="960" height="1280" loading="lazy" decoding="async" alt="Portrait in soft natural light">
            <span class="overlay"><span class="card-label">Natural light</span><span class="card-cat">Nature</span></span>
        </button>
        <button type="button" class="gallery-card wide" data-cat="friends" aria-label="View photo: Bestie core in golden light">
            <img src="assets/images/gallery-bestie.webp" width="1000" height="752" loading="lazy" decoding="async" alt="Nadeeshi and her best friend in golden light">
            <span class="overlay"><span class="card-label">Bestie core in golden light</span><span class="card-cat">Friends</span></span>
        </button>
        <button type="button" class="gallery-card " data-cat="friends" aria-label="View photo: Laughing through everything">
            <img src="assets/images/gallery-laughing.webp" width="960" height="1280" loading="lazy" decoding="async" alt="Friends laughing together">
            <span class="overlay"><span class="card-label">Laughing through everything</span><span class="card-cat">Friends</span></span>
        </button>
        <button type="button" class="gallery-card " data-cat="friends" aria-label="View photo: Awrudu Uthsawaya 2025">
            <img src="assets/images/gallery-batch.webp" width="1000" height="667" loading="lazy" decoding="async" alt="Batch photo at the Awrudu Uthsawaya 2025 celebration">
            <span class="overlay"><span class="card-label">Awrudu Uthsawaya 2025</span><span class="card-cat">Friends</span></span>
        </button>
    </div>
    <p class="gallery-empty" id="gallery-empty" hidden>No photos in this category yet.</p>
    <dialog class="lightbox" id="lightbox" aria-label="Photo viewer">
        <button class="lb-btn lb-close" type="button" aria-label="Close">&times;</button>
        <button class="lb-btn lb-prev" type="button" aria-label="Previous photo">‹</button>
        <button class="lb-btn lb-next" type="button" aria-label="Next photo">›</button>
        <figure>
            <img id="lb-img" src="" alt="">
            <figcaption><div class="card-label" id="lb-label"></div><div class="card-cat" id="lb-cat"></div></figcaption>
        </figure>
    </dialog>
